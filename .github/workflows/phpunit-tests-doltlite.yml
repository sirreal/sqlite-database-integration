name: PHPUnit Tests (Doltlite)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Doltlite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doltlite build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev tcl-dev

      - name: Check out Doltlite
        uses: actions/checkout@v4
        with:
          repository: dolthub/doltlite
          path: doltlite-src

      - name: Patch Doltlite for mysql-on-sqlite compatibility
        # Narrow, verifiable source-level patches applied before build:
        #
        # 1) src/build.c — neutralize the auto-conversion of composite/TEXT-PK
        #    tables to WITHOUT ROWID, so the driver's `ORDER BY ROWID`
        #    tie-breaks in info-schema reads keep working.
        #
        # 2) src/prolly_btree.c — fix a write-visibility bug in
        #    prollyBtCursorIndexMoveto. When a non-empty mutmap exists,
        #    the function calls findMatchingMutMapEntry which internally
        #    calls sqlite3VdbeRecordCompare with `pIdxKey->eqSeen = 0`
        #    on every comparison, clobbering the eqSeen flag that the
        #    tree scan loop above it set. OP_SeekGE with BTREE_SEEK_EQ
        #    relies on eqSeen to detect prefix matches, so the second
        #    same-table DELETE inside a SAVEPOINT lands on an exact
        #    match in the tree but SeekGE reads eqSeen=0 and bails to
        #    seek_not_found, skipping the actual delete. The patch
        #    saves eqSeen before findMatchingMutMapEntry and restores
        #    it when no mutmap entry overrides the tree result.
        #
        # 3) src/prolly_btree.c — in mergeScan, when emitting a tree
        #    entry check the mutmap for a DELETE on that tree key; if
        #    found, skip and advance. Without this, INSERT+DELETE+UPDATE
        #    in one transaction trips "database disk image is malformed".
        run: |
          BUILD=doltlite-src/src/build.c
          MOVETO=doltlite-src/src/prolly_btree.c

          # --- Patch 1: disable WITHOUT ROWID auto-conversion ---
          N=$(grep -cF '    tabOpts |= TF_WithoutRowid;' "$BUILD")
          if [ "$N" != "1" ]; then
            echo "::error::build.c patch: expected exactly 1 match, found $N"; exit 1
          fi
          sed -i 's@^    tabOpts |= TF_WithoutRowid;$@    /* patched off in CI: do not auto-convert composite-PK tables */ (void)0;@' "$BUILD"

          # --- Patch 2: preserve pIdxKey->eqSeen across findMatchingMutMapEntry ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/eqSeen-preservation.patch

          # --- Patch 3: check mutmap for tree-key DELETE in mergeScan ---
          patch -d doltlite-src -p1 --no-backup-if-mismatch \
            < .github/doltlite-patches/mergeScan-check-tree-delete.patch

          echo "--- Patched lines ---"
          grep -n 'patched off in CI\|savedEqSeen\|walked past' "$BUILD" "$MOVETO"

      - name: Build Doltlite shared library
        run: |
          mkdir -p build
          cd build
          # Same feature set we enable for stock-SQLite runs. PHP's pdo_sqlite
          # pulls in sqlite3_column_table_name, which needs COLUMN_METADATA.
          CFLAGS="-DSQLITE_ENABLE_COLUMN_METADATA -DSQLITE_ENABLE_FTS5 -DSQLITE_USE_URI -DSQLITE_ENABLE_JSON1" \
            ../configure
          make -j"$(nproc)" doltlite-lib
          ls -la libdoltlite* sqlite3.h
        working-directory: doltlite-src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          tools: phpunit-polyfills

      - name: Install Doltlite as the system libsqlite3
        # Replace the system libsqlite3 the dynamic linker resolves for
        # pdo_sqlite with the Doltlite build. This is more reliable than
        # LD_PRELOAD, which loses to pdo_sqlite's DT_NEEDED on libsqlite3.so.0.
        run: |
          SRC="${GITHUB_WORKSPACE}/doltlite-src/build/libdoltlite.so"
          test -f "$SRC"

          # Drop the build into /usr/local/lib and point libsqlite3 sonames at it,
          # both in /usr/local/lib (takes precedence in ld.so.conf) and in the
          # multiarch dir so anything hard-coded to that path still works.
          sudo install -m 0755 "$SRC" /usr/local/lib/libdoltlite.so

          sudo ln -sf /usr/local/lib/libdoltlite.so /usr/local/lib/libsqlite3.so
          sudo ln -sf /usr/local/lib/libdoltlite.so /usr/local/lib/libsqlite3.so.0

          MULTIARCH_DIR="$(dirname "$(readlink -f /lib/x86_64-linux-gnu/libsqlite3.so.0)")"
          sudo rm -f "${MULTIARCH_DIR}/libsqlite3.so.0"
          sudo ln -s /usr/local/lib/libdoltlite.so "${MULTIARCH_DIR}/libsqlite3.so.0"

          sudo ldconfig

          echo "ldd pdo_sqlite:"
          ldd "$(php -r 'echo ini_get("extension_dir");')/pdo_sqlite.so"

      - name: Verify Doltlite is active and patches took effect
        run: |
          VERSION=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT SQLITE_VERSION()")->fetch()[0];')
          ENGINE=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT doltlite_engine()")->fetch()[0];')
          echo "SQLITE_VERSION()  = ${VERSION}"
          echo "doltlite_engine() = ${ENGINE}"
          if [ "${ENGINE}" != "prolly" ]; then
            echo "::error::Doltlite is not active (expected doltlite_engine() = 'prolly', got '${ENGINE}')"
            exit 1
          fi
          # 1) build.c patch: composite-PK tables keep rowid accessible
          # instead of auto-converting to WITHOUT ROWID.
          ROWID=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE t (a INT, b INT, PRIMARY KEY(a, b))");
            $db->exec("INSERT INTO t VALUES (1, 2)");
            echo $db->query("SELECT rowid FROM t")->fetch()[0];
          ' 2>&1)
          echo "composite-PK rowid = ${ROWID}"
          if ! [[ "${ROWID}" =~ ^[0-9]+$ ]]; then
            echo "::error::rowid-preservation patch did not take effect: ${ROWID}"
            exit 1
          fi
          # 2) prolly_btree.c patch: two sequential DELETEs inside a
          # SAVEPOINT on a composite NOCASE PK no longer silently lose
          # the second DELETE.
          REMAINING=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE t (ts TEXT NOT NULL COLLATE NOCASE, tn TEXT NOT NULL COLLATE NOCASE, cn TEXT NOT NULL COLLATE NOCASE, PRIMARY KEY (ts, tn, cn))");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"id\")");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"alpha\")");
            $db->exec("INSERT INTO t VALUES (\"s\", \"t\", \"beta\")");
            $db->exec("SAVEPOINT sp");
            $db->exec("DELETE FROM t WHERE ts = \"s\" AND tn = \"t\" AND cn = \"alpha\"");
            $db->exec("DELETE FROM t WHERE ts = \"s\" AND tn = \"t\" AND cn = \"beta\"");
            $db->exec("RELEASE SAVEPOINT sp");
            $rows = $db->query("SELECT cn FROM t ORDER BY cn")->fetchAll(PDO::FETCH_COLUMN);
            echo implode(",", $rows);
          ' 2>&1)
          echo "post-SAVEPOINT remaining rows = ${REMAINING}"
          if [ "${REMAINING}" != "id" ]; then
            echo "::error::eqSeen-preservation patch did not take effect: expected only 'id', got '${REMAINING}'"
            exit 1
          fi
          # 3) mergeScan patch: UPDATE inside a transaction after an
          # INSERT + DELETE no longer trips "database disk image is
          # malformed".
          VAL=$(php -r '
            $db = new PDO("sqlite::memory:");
            $db->exec("CREATE TABLE c (ka TEXT, kb TEXT, kc TEXT, v TEXT, PRIMARY KEY (ka, kb, kc))");
            $db->exec("INSERT INTO c VALUES (\"db\", \"t\", \"a\", \"\")");
            $db->exec("BEGIN IMMEDIATE");
            $db->exec("INSERT INTO c VALUES (\"db\", \"t\", \"b\", \"\")");
            $db->exec("DELETE FROM c WHERE ka = \"db\" AND kb = \"t\" AND kc = \"a\"");
            $db->exec("UPDATE c SET v = \"x\" WHERE ka = \"db\" AND kb = \"t\"");
            $db->exec("COMMIT");
            echo $db->query("SELECT v FROM c")->fetch()[0];
          ' 2>&1)
          echo "post-UPDATE value = ${VAL}"
          if [ "${VAL}" != "x" ]; then
            echo "::error::mergeScan patch did not take effect: expected 'x', got '${VAL}'"
            exit 1
          fi

      - name: Install Composer dependencies (root)
        uses: ramsey/composer-install@v3
        with:
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install Composer dependencies (mysql-on-sqlite)
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Run PHPUnit tests against Doltlite
        run: php ./vendor/bin/phpunit -c ./phpunit.xml.dist
        working-directory: packages/mysql-on-sqlite
