name: PHPUnit Tests (Turso DB)

on:
  push:
    branches:
      - main
  pull_request:

# The test suite is run against Turso DB (https://github.com/tursodatabase/turso),
# a Rust reimplementation of SQLite. Turso is still in beta and its SQLite C API
# is only partially implemented; failing tests are expected and the job is purely
# informational. It tracks compatibility progress over time.
jobs:
  test:
    name: PHP 8.5 / Turso DB (latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine latest Turso release
        id: turso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo tursodatabase/turso --json tagName --jq .tagName)
          echo "Using Turso release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache Turso build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turso/target
          key: turso-${{ runner.os }}-${{ steps.turso.outputs.tag }}-${{ hashFiles('.github/workflows/phpunit-tests-turso.yml') }}

      - name: Clone Turso source
        run: git clone --depth 1 --branch '${{ steps.turso.outputs.tag }}' https://github.com/tursodatabase/turso.git

      # Turso's stub!() macro expands to a `todo!()` that panics across the FFI
      # boundary and aborts the PHP process. That blocks any call into a not-yet-
      # implemented sqlite3_* function — e.g. sqlite3_set_authorizer, which
      # PHP's pdo_sqlite calls during PDO construction. Rewrite the macro so
      # stubbed functions return a zeroed value of their return type instead
      # (0 / SQLITE_OK for ints, NULL for pointers). This lets the driver reach
      # functions Turso does implement, so PHPUnit can produce a real report.
      - name: Patch Turso stub macro to not abort
        working-directory: turso
        run: |
          sed -i 's|todo!("{} is not implemented", stringify!($fn));|return unsafe { std::mem::zeroed() };|' sqlite3/src/lib.rs
          echo '--- Patched stub! macro ---'
          sed -n '/macro_rules! stub/,/^}$/p' sqlite3/src/lib.rs

      - name: Build turso_sqlite3 shared library
        working-directory: turso
        run: cargo build --release -p turso_sqlite3

      - name: Verify Turso shared library exposes SQLite3 C API
        id: turso-lib
        run: |
          LIB="$GITHUB_WORKSPACE/turso/target/release/libturso_sqlite3.so"
          test -f "$LIB"
          echo "Library: $LIB"
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          echo '--- Sample of exported sqlite3_* symbols ---'
          nm -D --defined-only "$LIB" | awk '$3 ~ /^sqlite3_/ {print $3}' | sort | head -20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpunit-polyfills

      - name: Smoke-test pdo_sqlite against Turso
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.turso-lib.outputs.path }}
        run: |
          php <<'PHP'
          <?php
          echo "version: ", (new PDO('sqlite::memory:'))->query('SELECT sqlite_version()')->fetch()[0], "\n";

          $pdo = new PDO('sqlite::memory:');
          $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
          $pdo->exec('CREATE TABLE t (id INTEGER PRIMARY KEY, v TEXT)');
          echo "create table: ok\n";

          $pdo->exec("INSERT INTO t (v) VALUES ('hello')");
          echo "insert exec: ok\n";

          $stmt = $pdo->prepare('INSERT INTO t (v) VALUES (?)');
          $stmt->execute(['world']);
          echo "insert prepared: ok\n";

          $rows = $pdo->query('SELECT id, v FROM t ORDER BY id')->fetchAll(PDO::FETCH_ASSOC);
          echo "select: ", json_encode($rows), "\n";

          $stmt = $pdo->prepare('SELECT v FROM t WHERE id = ?');
          $stmt->execute([1]);
          echo "select prepared: ", $stmt->fetchColumn(), "\n";

          unset($stmt, $pdo);
          echo "close: ok\n";
          PHP

      - name: Install Composer dependencies (root)
        uses: ramsey/composer-install@v3
        with:
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Install Composer dependencies (mysql-on-sqlite)
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mysql-on-sqlite
          ignore-cache: "yes"
          composer-options: "--optimize-autoloader"

      - name: Diagnose createFunction behavior
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.turso-lib.outputs.path }}
        working-directory: packages/mysql-on-sqlite
        run: |
          # Use STDERR for progress logging so it is always flushed immediately.
          php <<'PHP'
          <?php
          $log = fn(string $s) => fwrite(STDERR, $s . "\n");

          $pdo_class = PHP_VERSION_ID >= 80400 ? PDO\SQLite::class : PDO::class;
          $pdo = new $pdo_class('sqlite::memory:');
          $log("[a] PDO({$pdo_class}) ok");

          // 1) Closure
          try {
              $pdo->createFunction('mk_closure', function ($x) { return $x . '!'; });
              $log('[b] createFunction(closure) ok');
              $r = $pdo->query("SELECT mk_closure('x') AS v")->fetch(PDO::FETCH_ASSOC);
              $log('[b.call] ' . json_encode($r));
          } catch (\Throwable $e) {
              $log('[b] EXC ' . $e->getMessage());
          }

          // 2) String callable
          try {
              $pdo->createFunction('mk_builtin', 'md5');
              $log('[c] createFunction("md5") ok');
              $r = $pdo->query("SELECT mk_builtin('abc') AS v")->fetch(PDO::FETCH_ASSOC);
              $log('[c.call] ' . json_encode($r));
          } catch (\Throwable $e) {
              $log('[c] EXC ' . $e->getMessage());
          }

          // 3) [object, method] callable
          try {
              $obj = new class {
                  public function greet($x) { return "hi $x"; }
              };
              $pdo->createFunction('mk_method', [$obj, 'greet']);
              $log('[d] createFunction([obj,method]) ok');
              $r = $pdo->query("SELECT mk_method('bob') AS v")->fetch(PDO::FETCH_ASSOC);
              $log('[d.call] ' . json_encode($r));
          } catch (\Throwable $e) {
              $log('[d] EXC ' . $e->getMessage());
          }

          // 4) Register many to see if limit matters.
          try {
              for ($i = 0; $i < 40; $i++) {
                  $pdo->createFunction("fn_{$i}", function () { return 1; });
                  if ($i === 30 || $i === 31 || $i === 32 || $i === 33 || $i === 39) {
                      $log("[e.{$i}] registered fn_{$i}");
                  }
              }
              $log('[e] bulk registration ok');
          } catch (\Throwable $e) {
              $log('[e] EXC at N=' . ($i ?? '?') . ': ' . $e->getMessage());
          }

          $log('[done] script finished cleanly');
          PHP

      - name: Run PHPUnit tests against Turso DB
        continue-on-error: true
        env:
          LD_PRELOAD: ${{ steps.turso-lib.outputs.path }}
        working-directory: packages/mysql-on-sqlite
        run: php ./vendor/bin/phpunit -c ./phpunit.xml.dist
